name: Paper XXII Lean Companion

on:
  pull_request:
    paths:
      - ".github/workflows/paper22-lean-companion.yml"
      - "experiments/paper22/lean/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/paper22-lean-companion.yml"
      - "experiments/paper22/lean/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build pinned Lean package
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          lake-package-directory: experiments/paper22/lean
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
