name: Paper XLV Candidate

on:
  pull_request:
    paths:
      - ".github/workflows/paper45-candidate.yml"
      - "docs/release-anchors/paper41-v1.0.json"
      - "docs/release-anchors/paper42-v1.0.json"
      - "docs/release-anchors/fusion-log-m5-source-v1.0.json"
      - "papers/paper45/**"
      - "papers/tex/**"
      - "experiments/paper45/**"
      - "experiments/fusion_log_compression/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/paper45-candidate.yml"
      - "docs/release-anchors/paper41-v1.0.json"
      - "docs/release-anchors/paper42-v1.0.json"
      - "docs/release-anchors/fusion-log-m5-source-v1.0.json"
      - "papers/paper45/**"
      - "papers/tex/**"
      - "experiments/paper45/**"
      - "experiments/fusion_log_compression/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper45-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Check numbered candidate and inherited source locks
        run: python -O -B experiments/paper45/validation/validate_candidate.py

      - name: Test rejection controls
        run: python -B -m unittest discover -s experiments/paper45/validation -p test_candidate.py -v

      - name: Replay bounded controls
        working-directory: experiments/fusion_log_compression/controls
        run: |
          python -B fusion_log_arbitrary_start_control.py --max-n 6
          python -B audit_math.py

      - name: Build pinned All-R Lean layer
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          lake-package-directory: experiments/fusion_log_compression/lean_all_r
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"

      - name: Check 69 transitive All-R axiom sets
        working-directory: experiments/fusion_log_compression/lean_all_r
        run: |
          lake env lean FusionLogAllR/AxiomAudit.lean > "$RUNNER_TEMP/paper45-all-r-axioms.txt" 2>&1
          python -O -B ../../paper45/validation/validate_all_r_audit.py "$RUNNER_TEMP/paper45-all-r-axioms.txt"
