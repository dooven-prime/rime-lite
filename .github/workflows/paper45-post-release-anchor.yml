name: Paper XLV Post-Release Anchor

on:
  pull_request:
    paths:
      - ".github/workflows/paper45-post-release-anchor.yml"
      - "docs/release-anchors/paper45-v1.0.json"
      - "tools/release/post_release_anchor.py"
  push:
    branches: [master]
    paths:
      - ".github/workflows/paper45-post-release-anchor.yml"
      - "docs/release-anchors/paper45-v1.0.json"
      - "tools/release/post_release_anchor.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Check tagged evidence and Zenodo deposit
        run: python -O -B tools/release/post_release_anchor.py validate docs/release-anchors/paper45-v1.0.json --check-remote
