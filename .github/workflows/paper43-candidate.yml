name: Paper XLIII Candidate Closure

on:
  pull_request:
    paths:
      - ".github/workflows/paper43-candidate.yml"
      - "papers/paper43/**"
      - "experiments/paper43/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/paper43-candidate.yml"
      - "papers/paper43/**"
      - "experiments/paper43/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper43-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-and-inherited-source:
    name: Candidate bytes and inherited controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject in-place changes to Paper XLIII owner files
        run: |
          if ! git diff --quiet paper43-v1.0 HEAD -- papers/paper43 experiments/paper43; then
            echo "::error::Paper XLIII owner files differ from the immutable v1.0 tag; publish a new owner version."
            exit 1
          fi

      - name: Replay the frozen Paper XLIII candidate
        run: git switch --detach paper43-v1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Verify numbered edition and historical Git bytes
        run: python -O -B tools/release/validate_numbered_migration_commit_candidate.py 43 --write-receipt

      - name: Test original finite controls
        run: python -B -m unittest discover -s experiments/future_event_minimal_quotient/tests -p test_controls.py

      - name: Test candidate rejection gates
        run: python -B -m unittest discover -s experiments/paper43/validation -p test_release.py

      - name: Retain candidate receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper43-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiments/paper43/results/paper43_candidate.validation-receipt.json
          if-no-files-found: warn
          retention-days: 90
