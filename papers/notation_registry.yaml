# notation_registry.yaml — shared mathematical notation for the RIME program
#
# Current papers use these forms where they share an object; Paper III remains
# self-contained and does not inherit claims from Papers I--II or CCS.
# validate_registry.py checks for forbidden variants.
#
# Typesetting rule:
#   \operatorname{} — multi-letter mathematical operators (Comm, End, Tr, Spec, …)
#   \mathrm{}       — invariant label abbreviations (cp, ep, QT, HT, nc, …)
#   \text{}         — English words inside math mode (rare; only when meaning matters)

version: '2.0.0'
date: 2026-07-23

# ── Typesetting Rules ──────────────────────────────────────────────────
typesetting:
  operator: '\operatorname{...}'
  operator_rule: 'All multi-letter mathematical operators use \\operatorname (Comm, End, Tr, Spec, Supp, coker, ker, dim, Hom, im, rank, Lie)'
  label: '\mathrm{...}'
  label_rule: 'Invariant label abbreviations use \\mathrm (cp, ep, co, eo, QT, HT, nc, all, T7 in math mode)'
  text: '\text{...}'
  text_rule: '\\text only for English words whose meaning matters in the math expression'

# ── Core Objects ───────────────────────────────────────────────────────
core:
  representation:
    symbol: '\rho'
    description: 'Unitary representation G → GL(V)'
    forbidden: []

  group:
    symbol: 'G'
    description: 'Finite group (Rubik cube group)'
    forbidden: []

  space:
    symbol: 'V'
    description: 'Representation space V = ℂ²²⁸'
    forbidden: []

  generating_set:
    symbol: 'S'
    description: 'Symmetric generating set S = S⁻¹'
    forbidden: []

# ── Averaging Operator ─────────────────────────────────────────────────
averaging_operator:
  symbol: 'A'
  definition: 'A = (1/|S|) Σ_{s∈S} ρ(s)'
  disambiguation:
    A_18: 'When generator count matters, use A_{18} (canonical 18-generator)'
    A_S: 'For non-canonical generator sets'
    A_block: 'Block restriction: A_{cp}, A_{ep}, A_{co}, A_{eo}'
  math_mode: 'A'
  forbidden:
    - 'lam18'
    - 'lam_{18}'
    - 'A_18 as default (use A unless generator count is essential)'

# ── Spectrum ───────────────────────────────────────────────────────────
spectrum:
  eigenvalue:
    symbol: '\lambda'
    formula: '\lambda = 1 - k/9'
    math_mode: '\lambda'
    forbidden:
      - 'lam18'
      - 'lam_{18}'

  eigenspace:
    symbol: 'V_{\lambda}'
    description: 'Spectral layer (eigenspace of A)'
    math_mode: 'V_{\\lambda}'

  projector:
    symbol: 'P_{\lambda}'
    description: 'Spectral projector onto V_λ'
    math_mode: 'P_{\\lambda}'

  dimension:
    symbol: 'd_{\lambda}'
    description: 'dim V_λ'
    math_mode: 'd_{\\lambda} = \\dim V_{\\lambda}'

  k_set:
    symbol: '\mathcal{K}'
    description: 'Set of admissible k-values'
    math_mode: '\\mathcal{K}(A)'

  spectrum_operator:
    symbol: '\operatorname{Spec}'
    math_mode: '\\operatorname{Spec}(A)'
    forbidden:
      - '\\mathrm{Spec}'
      - '\\text{Spec}'

# ── Blocks ─────────────────────────────────────────────────────────────
blocks:
  labels:
    canonical: ['cp', 'ep', 'co', 'eo']
    description:
      cp: 'corner permutation (64-dim)'
      ep: 'edge permutation (144-dim)'
      co: 'corner orientation (8-dim, Z₃ phase)'
      eo: 'edge orientation (12-dim, Z₂ phase)'

  math_mode:
    subscript: '\mathrm{cp}, \mathrm{ep}, \mathrm{co}, \mathrm{eo}'
    block_space: 'V_{\mathrm{cp}} \\oplus V_{\mathrm{ep}} \\oplus V_{\mathrm{co}} \\oplus V_{\mathrm{eo}}'
    block_operator: 'A_{\mathrm{cp}}, A_{\mathrm{ep}}, A_{\mathrm{co}}, A_{\mathrm{eo}}'
    block_representation: '\rho_{\mathrm{cp}}, \rho_{\mathrm{ep}}, \rho_{\mathrm{co}}, \rho_{\mathrm{eo}}'
    block_character: '\chi_{\mathrm{cp}}, \chi_{\mathrm{ep}}, \chi_{\mathrm{co}}, \chi_{\mathrm{eo}}'

  text_mode:
    uppercase: 'CP, EP, CO, EO — for plain text, tables, figure labels'
    lowercase: 'cp, ep, co, eo — for inline code-style references'

  forbidden:
    - 'E_P'
    - 'E_O'
    - 'C_P'
    - 'C_O'
    - 'even permutation block'
    - 'edge-permutation block'  # use 'EP block' or 'edge permutation block' (no hyphen)
    - 'CP-block'               # use 'CP block'
    - '\\text{cp}'             # use \\mathrm{cp} in math mode
    - '\\text{ep}'
    - '\\text{co}'
    - '\\text{eo}'
  warning:
    - EP-block  # use 'EP block'

# ── Sectors ────────────────────────────────────────────────────────────
sectors:
  count: 9
  labels: ['S1', 'S2', 'S3', 'S4', 'S5', 'S6', 'S7', 'S8', 'S9']
  generic:
    symbol: 'S_{\\alpha}'
    description: 'QH joint-spectral sector (legacy: primitive sector; joint eigenspace of the registered commuting algebra B_QH)'
  projector:
    symbol: 'Q_{\\alpha}'
    description: 'QH sector projector; not assumed to commute with the full G action'
  hub:
    primary: 'S6'
    secondary: 'S7'
    isolated: 'S1'
  forbidden:
    - '\\text{S1}'  # use plain S1 in text, no \text wrapper
    - '\\mathrm{S}_k'  # sector labels are plain, not \mathrm

# ── Transport ──────────────────────────────────────────────────────────
transport:
  tensor:
    symbol: 'K^S'
    definition: 'K^S_{\\beta\\alpha} = \\max_{s\\in S} \\|Q_\\beta \\rho(s) Q_\\alpha\\|_F'
    math_mode: 'K^S_{\\beta\\alpha}'

  kappa:
    symbol: '\kappa_d'
    kappa_0: '\kappa_0'  # Lie gradient (depth 0)
    kappa_1: '\kappa_1'  # Lie curvature (depth 1)
    kappa_d: '\kappa_d'  # general depth d
    description: 'Lie accessibility hierarchy'

  accessibility:
    support_graph: '\\Gamma_S'
    operator_direct_support: 'R_1^{\\mathrm{op}}'
    lie_direct_support: 'R_1^{\\mathrm{Lie}}'
    lie_bracket_support: 'R_2^{\\mathrm{Lie}}'
    routed_product: 'Q_iY_{a_d}Q_{k_{d-1}}\\cdots Q_{k_1}Y_{a_1}Q_j'
    routed_support: 'C_d[\\mathcal Y]'
    full_word_support: 'W_d[\\mathcal Y]'
    routed_depth: 'D_{\\mathrm{route}}[\\mathcal Y]'
    word_depth: 'D_{\\mathrm{word}}[\\mathcal Y]'
    lie_depth: 'D_{\\mathrm{Lie}}'
    cutoff_state: '\\mathrm{unreached}'
    graph_composition_relation: 'C_d[\\mathcal Y] \\subseteq \\operatorname{Path}_d(R_1[\\mathcal Y])'
    word_composition_relation: 'W_d[\\mathcal Y] \\subseteq C_d[\\mathcal Y]'
    qualification_rule: 'Unqualified R_1, R_2, or D is local-only after one family type and one depth convention are declared'

  spectral_domain:
    commutative_locus: '\\Sigma_{\\mathrm{comm}}'
    commuting_normal_locus: '\\Sigma_{\\mathrm{normal}}'
    normal_spectral_chart: '\\Sigma_{\\mathrm{spec}}'
    inclusion: '\\Sigma_{\\mathrm{spec}} \\subseteq \\Sigma_{\\mathrm{normal}} \\subseteq \\Sigma_{\\mathrm{comm}}'
    rule: 'Coherent orthogonal projector fields require normality and a certified spectral chart, not commutativity alone'

  forbidden:
    - 'lam18'         # use λ
    - 'T_7'
    - 'T7 morphism'

# ── Commutant ──────────────────────────────────────────────────────────
commutant:
  symbol: '\operatorname{Comm}'
  comm_rho: '\operatorname{Comm}(\rho)'
  comm_A: '\operatorname{Comm}(A)'
  comm_gap: 'withdrawn historical quantity'
  description: 'Ambient commutant is distinct from spectral centralizers; dimension 610 remains a candidate pending exact certification'

  endomorphism:
    symbol: '\operatorname{End}_G(V)'
    description: 'G-equivariant endomorphisms (= commutant)'

  forbidden:
    - '\\text{Comm}'          # use \operatorname{Comm}
    - '\\mathrm{Comm}'        # use \operatorname{Comm}
    - '\\text{End}'           # use \operatorname{End}
    - '\\mathrm{End}'         # use \operatorname{End}
    - 'C(\\rho)'              # use Comm(ρ) — reserve C for center subalgebra
    - '\\text{Comm}(\\rho(G))'  # use \operatorname{Comm}(\rho)

# ── QH spectral algebra ───────────────────────────────────────────────
qh_algebra:
  symbol: '\mathcal B_{\mathrm{QH}}'
  canonical: '\operatorname{alg}(A, \mathrm{QT}_{\mathrm{all}}, \mathrm{HT}_{\mathrm{all}})'
  description: 'Registered commuting QH spectral algebra; not contained in End_G(V)'

  forbidden:
    - '\\text{Center}'     # use \operatorname{Center}
    - '\\mathrm{Center}'   # use \operatorname{Center}

# ── Operators ──────────────────────────────────────────────────────────
operators:
  QT:
    symbol: '\mathrm{QT}^a'
    all: '\mathrm{QT}_{\mathrm{all}}'
    description: 'Quarter-turn averaging operator on axis a'

  HT:
    symbol: '\mathrm{HT}^a'
    all: '\mathrm{HT}_{\mathrm{all}}'
    description: 'Half-turn averaging operator on axis a'

  lie_generator:
    symbol: 'A_g'
    definition: 'A_g = \log \rho(g)'
    description: 'Lie algebra generator (matrix logarithm of group element)'

  lie_algebra:
    symbol: '\mathcal{L}'
    definition: '\mathcal{L} = \operatorname{Lie}\{A_g\}'
    description: 'Lie algebra spanned by log-generators'

  forbidden:
    - '\\text{QT}'          # use \mathrm{QT}
    - '\\text{HT}'          # use \mathrm{HT}
    - '\\text{QT}_{\\text{all}}'  # use \mathrm{QT}_{\mathrm{all}}
    - '\\text{HT}_{\\text{all}}'  # use \mathrm{HT}_{\mathrm{all}}
    - '\\text{Lie}'         # use \operatorname{Lie}

# ── Support ────────────────────────────────────────────────────────────
support:
  noncommutative:
    symbol: '\operatorname{Supp}_{\mathrm{nc}}(\alpha)'
    description: 'Set of sector-supported blocks where the maximum per-axis-family QT commutator norm exceeds the declared threshold'

  isotypic:
    symbol: '\operatorname{Supp}(E_\alpha)'
    description: 'Set of irreps appearing in sector E_α'

  forbidden:
    - '\\text{Supp}'            # use \operatorname{Supp}
    - '\\text{Supp}_{\\text{nc}}'  # use \operatorname{Supp}_{\mathrm{nc}}
    - '\\mathrm{Supp}_{\\mathrm{nc}}'  # use \operatorname{Supp}_{\mathrm{nc}}
    - '\\mathrm{Supp}'          # use \operatorname{Supp}

# ── Trace / Dim / Common Operators ─────────────────────────────────────
common_operators:
  trace:
    symbol: '\operatorname{Tr}'
    math_mode: '\\operatorname{Tr}(X)'

  dimension:
    symbol: '\dim'
    math_mode: '\\dim V'

  kernel:
    symbol: '\ker'
    math_mode: '\\ker(A - \\lambda I)'

  cokernel:
    symbol: '\operatorname{coker}'
    math_mode: '\\operatorname{coker} \\pi'

  image:
    symbol: '\operatorname{im}'
    math_mode: '\\operatorname{im}(P)'

  forbidden:
    - '\\mathrm{Tr}'        # use \operatorname{Tr}
    - '\\text{Tr}'          # use \operatorname{Tr}
    - '\\mathrm{coker}'     # use \operatorname{coker}

# ── S₃ Prototypes ─────────────────────────────────────────────────────
s3_prototypes:
  nat_reg: 'S_3 \\; \\mathrm{nat} \\oplus \\mathrm{reg}'
  reg_reg: 'S_3 \\; \\mathrm{reg} \\oplus \\mathrm{reg}'
  irreps: ['\mathrm{triv}', '\mathrm{sign}', '\mathrm{std}']
  forbidden: []

# ── Structural Laws ────────────────────────────────────────────────────
structural_laws:
  S1: 'Canonical Spectral Census — 6 layers for the declared 18-generator average'
  S2: 'Direct Transport Locality — all direct blocks preserve physical blocks'
  S3: 'Graph/Composition Separation — five support paths have machine-zero products'
  S4: 'M₂ Overlap Pattern — finite Rubik observation, not a universal theorem'
  S5: 'S1 Direct Isolation — no off-diagonal direct edge; exact invariance open'
  S6: 'Transport–Non-Invariance — outgoing mass equals half commutator mass'
