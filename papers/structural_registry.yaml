# Structural Registry — non-theorem objects with permanent cross-reference labels.
#
# Three types: appendix, figure, table.  Each entry maps a stable label to its
# canonical location (display name in PDF) and a short title.
#
# Usage:
#   - In MD papers:  \ref{app:ccs-tolerance-regime}  (resolves via xr)
#   - Auto-export:   python _registry.py structural   →  structural_map.json

